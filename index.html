<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101e2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="Your pocket practice plan and sideline companion for 8U soccer."
    />
    <title>8U Coach • The sideline, simplified</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to coaching</a>
    <header>
      <a href="#today" class="brand" aria-label="8U Coach home"
        ><b>8<span>U</span></b
        ><span>COACH<small>YOUR SIDELINE COMPANION</small></span></a
      >
      <div class="header-actions">
        <button data-go="safety" class="quiet">Safety</button
        ><button data-go="tools" class="quiet">Tools</button
        ><button data-go="settings" class="quiet">Settings</button>
      </div>
    </header>
    <div id="storage-warning" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
    <nav id="nav" aria-label="Main navigation"></nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"></dialog>
    <script src="./data/drills.js"></script>
    <script src="./data/practices.js"></script>
    <script src="./data/rules.js"></script>
    <script src="./data/coaching-cues.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
